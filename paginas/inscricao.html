<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TokenEJPA - Inscricao em Cursos (PoC v03)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0b0f14; color: #e6edf3;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh;
  }
  header { padding: 18px 16px 6px; text-align: center; }
  header h1 { font-size: 1.1rem; margin: 0 0 4px; }
  header p { font-size: 0.8rem; color: #9aa7b1; margin: 0; }
  nav.voltar { font-size: 0.78rem; margin-bottom: 6px; }
  nav.voltar a { color: #6bb0ff; text-decoration: none; }

  .cartao {
    max-width: 480px; width: calc(100% - 32px); margin: 12px 16px;
    background: #131a21; border: 1px solid #232c35; border-radius: 12px;
    padding: 18px;
  }
  label { display: block; font-size: 0.8rem; color: #9aa7b1; margin: 10px 0 4px; }
  input {
    width: 100%; background: #0b0f14; border: 1px solid #232c35; color: #e6edf3;
    border-radius: 8px; padding: 10px 12px; font-size: 1rem;
  }
  button {
    cursor: pointer; border: none; border-radius: 8px; font-weight: 600;
    font-size: 0.9rem; padding: 9px 18px;
  }
  .btn-principal { background: #2563eb; color: #fff; }
  .btn-secundario { background: #232c35; color: #e6edf3; }
  .btn-perigo { background: #6b1f1f; color: #ffd7d7; }
  .btn-disabled { background: #1a2129; color: #4f5a63; cursor: default; }
  #erroBusca { color: #ff9a9a; font-size: 0.82rem; min-height: 1.2em; margin-top: 8px; }

  h2.secao {
    font-size: 0.8rem; color: #9aa7b1; text-transform: uppercase;
    letter-spacing: 0.06em; margin: 22px 16px 8px; display: flex;
    justify-content: space-between; align-items: center;
  }
  h2.secao button { font-size: 0.7rem; padding: 4px 10px; text-transform: none; letter-spacing: 0; }

  #painelPessoa { display: none; width: 100%; max-width: 480px; }
  #painelPessoa.mostrar { display: block; }

  .cabecalhoPessoa { padding: 0 16px; font-size: 0.9rem; }
  .cabecalhoPessoa b { display: block; font-size: 1.05rem; }

  .curso {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .curso .info b { display: block; font-size: 0.98rem; }
  .curso .info span { font-size: 0.78rem; color: #9aa7b1; }
  .curso + .curso { margin-top: 10px; padding-top: 10px; border-top: 1px solid #232c35; }
  .selo-auto { color: #e0c96b; }

  .vazio { font-size: 0.85rem; color: #6b7680; padding: 4px 16px 0; }
</style>
</head>
<body>

<header>
  <nav class="voltar"><a href="/">&larr; inicio</a></nav>
  <h1>TokenEJPA - Inscricao em Cursos (PoC v03)</h1>
  <p>Simula o "aluno" se inscrevendo (ou nao) em cada curso de teste</p>
</header>

<div class="cartao">
  <label for="campoMatricula">Matricula</label>
  <input type="text" id="campoMatricula" inputmode="numeric" placeholder="ex.: 100001">
  <div id="erroBusca"></div>
  <button class="btn-principal" id="btnBuscar" style="width:100%; margin-top:12px;">Buscar</button>
  <div class="vazio" style="padding:12px 0 0;">
    Use a matricula gerada na tela de <a href="/cadastro" style="color:#6bb0ff;">cadastro</a>.
  </div>
</div>

<div id="painelPessoa">
  <div class="cabecalhoPessoa">
    Inscrevendo: <b id="nomePessoa">-</b>
    <span style="color:#9aa7b1;">matricula <span id="matriculaPessoa"></span></span>
  </div>

  <h2 class="secao">
    Cursos
    <button class="btn-perigo" id="btnReset">Resetar inscricoes e presencas</button>
  </h2>
  <div class="cartao" id="cartaoCursos"></div>
</div>

<script>
(function () {
  "use strict";

  const campoMatricula = document.getElementById("campoMatricula");
  const erroBusca = document.getElementById("erroBusca");
  const btnBuscar = document.getElementById("btnBuscar");
  const painelPessoa = document.getElementById("painelPessoa");
  const nomePessoa = document.getElementById("nomePessoa");
  const matriculaPessoa = document.getElementById("matriculaPessoa");
  const cartaoCursos = document.getElementById("cartaoCursos");
  const btnReset = document.getElementById("btnReset");

  let matriculaAtual = null;
  let cursosCache = null;

  async function obterCursos() {
    if (cursosCache) return cursosCache;
    const resp = await fetch("/api/cursos");
    cursosCache = await resp.json();
    return cursosCache;
  }

  async function buscar() {
    const mat = campoMatricula.value.trim();
    if (!mat) {
      erroBusca.textContent = "Informe a matricula.";
      return;
    }
    erroBusca.textContent = "";
    const resp = await fetch("/api/pessoas/" + encodeURIComponent(mat));
    if (!resp.ok) {
      const dados = await resp.json().catch(() => ({}));
      erroBusca.textContent = dados.erro || "Matricula nao encontrada.";
      painelPessoa.classList.remove("mostrar");
      return;
    }
    const pessoa = await resp.json();
    matriculaAtual = pessoa.mat;
    nomePessoa.textContent = pessoa.nome;
    matriculaPessoa.textContent = pessoa.mat;
    painelPessoa.classList.add("mostrar");
    await renderizarCursos(pessoa);
  }

  async function renderizarCursos(pessoa) {
    const cursos = await obterCursos();
    cartaoCursos.innerHTML = "";
    cursos.forEach((curso) => {
      const inscrito = Object.prototype.hasOwnProperty.call(pessoa.inscrito_em, curso.curso_id);
      const auto = pessoa.inscrito_em[curso.curso_id];

      const linha = document.createElement("div");
      linha.className = "curso";
      linha.innerHTML =
        "<div class='info'><b>" + curso.nome + "</b><span>" + curso.curso_id +
        (inscrito ? (auto ? " - inscrito automaticamente pelo leitor" : " - inscrito") : "") +
        "</span></div>";

      const btn = document.createElement("button");
      if (inscrito) {
        btn.className = "btn-disabled";
        btn.textContent = "Ja inscrito";
        btn.disabled = true;
      } else {
        btn.className = "btn-principal";
        btn.textContent = "Inscrever-se";
        btn.addEventListener("click", () => inscrever(curso));
      }
      linha.appendChild(btn);
      cartaoCursos.appendChild(linha);
    });
  }

  async function inscrever(curso) {
    await fetch("/api/inscricoes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mat: matriculaAtual, curso_id: curso.curso_id }),
    });
    const resp = await fetch("/api/pessoas/" + encodeURIComponent(matriculaAtual));
    const pessoa = await resp.json();
    await renderizarCursos(pessoa);
  }

  async function resetar() {
    if (!confirm("Isso apaga TODAS as inscricoes e presencas registradas (mantem as pessoas cadastradas). Confirmar?")) {
      return;
    }
    await fetch("/api/reset/inscricoes", { method: "POST" });
    if (matriculaAtual) {
      const resp = await fetch("/api/pessoas/" + encodeURIComponent(matriculaAtual));
      const pessoa = await resp.json();
      await renderizarCursos(pessoa);
    }
  }

  btnBuscar.addEventListener("click", buscar);
  campoMatricula.addEventListener("keydown", (e) => { if (e.key === "Enter") buscar(); });
  btnReset.addEventListener("click", resetar);
})();
</script>

</body>
</html>
